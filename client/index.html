<body>
    <h1 style="text-align: center">Multiplayer Snake</h1>
    <div id="login_wrapper">
        <input type="text" placeholder="Name" id="username_input">
        <button onclick="onJoin()">Play</button>
    </div>
    <div id="game" style="display: none;">
        <div id="sketch-holder"></div>
        <div id="msgWrapper">
            <h3>Messages</h3>
            <div id="messages"></div>
            <div id="msginputwrapper">
                <input type="text" id="msgString" placeholder="Type Message">
                <button onclick="sendMsg()" id="sendMsg">Send</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.1.9/lib/p5.js"></script>
